[bumpversion]
current_version = 0.2.0
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:electrochem/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
exclude = docs, MainWindow.py
max-line-length = 88
extend-ignore = E203,E701

[pylint]
# Change for consistency with black
max-line-length = 88
# Allow pylint to check PyQt5 modules
extension-pkg-whitelist=PyQt5
# Project preferences
ignore = MainWindow.py
disable=fixme

[tool.isort]
profile="black"

[aliases]
test = pytest

[tool:pytest]
collect_ignore = ['setup.py']
